version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: machinations-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: tula-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - machinations_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tula-app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  machinations_postgres_data:
